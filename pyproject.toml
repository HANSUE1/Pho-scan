# Tooling configuration only — the app is run from source or built with
# PyInstaller (see README), it is not installed as a package.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F", "E9", "B", "UP"]
# QModelIndex() as a default argument is the standard Qt model idiom.
ignore = ["B008"]
